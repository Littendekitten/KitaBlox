<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KitaBlox - Voxel Sandbox</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      z-index: 5; display: none;
    }

    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; color: white;
    }
    .menu-card {
      background: #1e293b; padding: 32px; border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); width: 380px; text-align: center;
      border: 1px solid #334155;
    }
    .menu-card h1 { color: #7ec850; margin: 0 0 5px 0; font-size: 36px; font-weight: 800; }
    .menu-card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .btn-play {
      width: 100%; padding: 14px; background: #7ec850; border: none; border-radius: 8px;
      color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
    }
    .btn-play:hover { background: #68b03c; }

    #instructions {
      position: absolute; top: 20px; left: 20px;
      color: white; background: rgba(0,0,0,0.5); padding: 14px; border-radius: 8px;
      font-size: 13px; z-index: 5; display: none; backdrop-filter: blur(4px);
    }

    #hotbar-container {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%); display: none; gap: 8px;
      background: rgba(15, 23, 42, 0.7); padding: 8px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); z-index: 10; backdrop-filter: blur(6px);
    }
    .hotbar-slot {
      width: 50px; height: 50px; background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.2); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 11px; font-weight: bold; position: relative;
    }
    .hotbar-slot.active {
      border-color: #7ec850; background: rgba(126, 200, 80, 0.25);
      transform: scale(1.08);
    }
    .slot-num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #cbd5e1; }
    .slot-label { margin-top: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  </style>
</head>
<body>

  <div id="menu-overlay">
    <div class="menu-card">
      <h1>KitaBlox</h1>
      <p>Multiplayer Voxel Sandbox</p>
      <button class="btn-play" id="start-game-btn">Click to Play</button>
    </div>
  </div>

  <div id="crosshair"></div>
  
  <div id="instructions">
    <b style="color: #7ec850;">KitaBlox Controls</b><br>
    WASD: Move | SPACE: Jump<br>
    Left Click: Break Block<br>
    Right Click: Place Block<br>
    1-5 / Scroll: Select Hotbar
  </div>

  <div id="hotbar-container">
    <div class="hotbar-slot active" data-slot="0"><span class="slot-num">1</span><span class="slot-label">Grass</span></div>
    <div class="hotbar-slot" data-slot="1"><span class="slot-num">2</span><span class="slot-label">Dirt</span></div>
    <div class="hotbar-slot" data-slot="2"><span class="slot-num">3</span><span class="slot-label">Stone</span></div>
    <div class="hotbar-slot" data-slot="3"><span class="slot-num">4</span><span class="slot-label">Wood</span></div>
    <div class="hotbar-slot" data-slot="4"><span class="slot-num">5</span><span class="slot-label">Planks</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // 1. TEXTURE GENERATOR
    function createPixelTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 16; canvas.height = 16;
      const ctx = canvas.getContext('2d');

      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          let noise = (Math.random() - 0.5) * 20;
          if (type === 'grass_top') ctx.fillStyle = `rgb(${100 + noise}, ${185 + noise}, ${60 + noise})`;
          else if (type === 'dirt') ctx.fillStyle = `rgb(${130 + noise}, ${85 + noise}, ${50 + noise})`;
          else if (type === 'grass_side') ctx.fillStyle = y < 4 ? `rgb(${100 + noise}, ${185 + noise}, ${60 + noise})` : `rgb(${130 + noise}, ${85 + noise}, ${50 + noise})`;
          else if (type === 'stone') ctx.fillStyle = `rgb(${120 + noise}, ${120 + noise}, ${125 + noise})`;
          else if (type === 'wood') ctx.fillStyle = `rgb(${100 + noise}, ${65 + noise}, ${35 + noise})`;
          else if (type === 'planks') ctx.fillStyle = `rgb(${180 + noise}, ${135 + noise}, ${80 + noise})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    const textures = {
      grassTop: createPixelTexture('grass_top'),
      grassSide: createPixelTexture('grass_side'),
      dirt: createPixelTexture('dirt'),
      stone: createPixelTexture('stone'),
      wood: createPixelTexture('wood'),
      planks: createPixelTexture('planks')
    };

    const blockMaterials = {
      1: [new THREE.MeshLambertMaterial({map: textures.grassSide}), new THREE.MeshLambertMaterial({map: textures.grassSide}), new THREE.MeshLambertMaterial({map: textures.grassTop}), new THREE.MeshLambertMaterial({map: textures.dirt}), new THREE.MeshLambertMaterial({map: textures.grassSide}), new THREE.MeshLambertMaterial({map: textures.grassSide})],
      2: new THREE.MeshLambertMaterial({map: textures.dirt}),
      3: new THREE.MeshLambertMaterial({map: textures.stone}),
      4: new THREE.MeshLambertMaterial({map: textures.wood}),
      5: new THREE.MeshLambertMaterial({map: textures.planks})
    };

    // 2. WORLD DATA
    const worldBlocks = {};
    const blockMeshes = {};
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    function setBlock(x, y, z, type) {
      const key = `${x},${y},${z}`;
      if (type === 0) {
        if (blockMeshes[key]) {
          scene.remove(blockMeshes[key]);
          delete blockMeshes[key];
          delete worldBlocks[key];
        }
      } else {
        if (blockMeshes[key]) scene.remove(blockMeshes[key]);
        const mesh = new THREE.Mesh(boxGeo, blockMaterials[type]);
        mesh.position.set(x, y, z);
        mesh.userData = { x, y, z };
        scene.add(mesh);
        blockMeshes[key] = mesh;
        worldBlocks[key] = type;
      }
    }

    // 3. GAME INITIALIZATION
    let scene, camera, renderer, controls, raycaster, highlightBox;
    let activeBlockType = 1;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x78a7ff);
      scene.fog = new THREE.FogExp2(0x78a7ff, 0.025);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
      renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      document.body.appendChild(renderer.domElement);

      const sun = new THREE.DirectionalLight(0xffffff, 0.95);
      sun.position.set(30, 50, 20);
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0x8899aa, 0.65));

      controls = new THREE.PointerLockControls(camera, document.body);
      raycaster = new THREE.Raycaster();
      raycaster.far = 7;

      // Selection Highlight Wireframe Box
      const wireGeo = new THREE.BoxGeometry(1.01, 1.01, 1.01);
      const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
      highlightBox = new THREE.LineSegments(new THREE.WireframeGeometry(wireGeo), wireMat);
      highlightBox.visible = false;
      scene.add(highlightBox);

      // Generate Initial World
      for (let x = -10; x <= 10; x++) {
        for (let z = -10; z <= 10; z++) {
          let h = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2);
          setBlock(x, h, z, 1);
          setBlock(x, h - 1, z, 2);
          setBlock(x, h - 2, z, 3);
        }
      }

      camera.position.set(0, 5, 0);
      setupInputs();
      animate();
    }

    // 4. PLAYER CONTROLS & INTERACTIONS
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, spaceHeld = false;
    let velocityY = 0, onGround = false;

    function setupInputs() {
      document.getElementById('start-game-btn').addEventListener('click', () => {
        document.getElementById('menu-overlay').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('instructions').style.display = 'block';
        document.getElementById('hotbar-container').style.display = 'flex';
        controls.lock();
      });

      controls.addEventListener('unlock', () => {
        document.getElementById('menu-overlay').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'none';
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveForward = true;
        if (e.code === 'KeyS') moveBackward = true;
        if (e.code === 'KeyA') moveLeft = true;
        if (e.code === 'KeyD') moveRight = true;
        if (e.code === 'Space') spaceHeld = true;
        if (e.key >= '1' && e.key <= '5') selectHotbar(parseInt(e.key) - 1);
      });

      document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveForward = false;
        if (e.code === 'KeyS') moveBackward = false;
        if (e.code === 'KeyA') moveLeft = false;
        if (e.code === 'KeyD') moveRight = false;
        if (e.code === 'Space') spaceHeld = false;
      });

      document.addEventListener('mousedown', (e) => {
        if (!controls.isLocked) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(Object.values(blockMeshes));

        if (intersects.length > 0) {
          const hit = intersects[0];
          const pos = hit.object.position;

          if (e.button === 0) { // Left Click: Destroy Block
            setBlock(pos.x, pos.y, pos.z, 0);
          } else if (e.button === 2) { // Right Click: Place Block
            const normal = hit.face.normal;
            const px = pos.x + normal.x;
            const py = pos.y + normal.y;
            const pz = pos.z + normal.z;

            // Prevent placing inside player
            const pX = Math.round(camera.position.x);
            const pY = Math.round(camera.position.y);
            const pZ = Math.round(camera.position.z);
            if (!(px === pX && (py === pY || py === pY - 1) && pz === pZ)) {
              setBlock(px, py, pz, activeBlockType);
            }
          }
        }
      });

      window.addEventListener('contextmenu', e => e.preventDefault());
    }

    function selectHotbar(idx) {
      activeBlockType = idx + 1;
      const slots = document.querySelectorAll('.hotbar-slot');
      slots.forEach((s, i) => s.classList.toggle('active', i === idx));
    }

    // 5. PHYSICS & GAME LOOP
    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        // Movement
        const prevX = camera.position.x;
        const prevZ = camera.position.z;
        if (moveForward) controls.moveForward(0.12);
        if (moveBackward) controls.moveForward(-0.12);
        if (moveLeft) controls.moveRight(-0.12);
        if (moveRight) controls.moveRight(0.12);

        // Simple Wall Collision
        const currentX = Math.round(camera.position.x);
        const currentY = Math.floor(camera.position.y - 1.5);
        const currentZ = Math.round(camera.position.z);
        if (worldBlocks[`${currentX},${currentY + 1},${currentZ}`]) {
          camera.position.x = prevX;
          camera.position.z = prevZ;
        }

        // Gravity & Jump Physics
        velocityY -= 0.009;
        camera.position.y += velocityY;

        const groundY = (worldBlocks[`${currentX},${currentY},${currentZ}`] !== undefined ? currentY + 1 : -10) + 1.6;
        if (camera.position.y <= groundY) {
          camera.position.y = groundY;
          velocityY = 0;
          onGround = true;
          if (spaceHeld) velocityY = 0.16;
        }

        // Raycast Block Selection Highlight
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(Object.values(blockMeshes));
        if (intersects.length > 0) {
          highlightBox.position.copy(intersects[0].object.position);
          highlightBox.visible = true;
        } else {
          highlightBox.visible = false;
        }
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
