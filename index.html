<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KitaBlox - Infinite World</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 8px; height: 8px;
      background: white; border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
      border: 1px solid black;
    }
    #instructions {
      position: absolute; top: 20px; left: 20px;
      color: white; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="instructions">
    <b style="font-size: 18px; color: #7ec850;">Welcome to KitaBlox!</b><br><br>
    <b>Click screen to Play</b><br>
    WASD: Move<br>
    SPACE: Jump<br>
    MOUSE: Look around
  </div>

  <!-- Load Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <!-- Load Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // 1. FIREBASE SETUP
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. THREE.JS ENGINE & OPTIMIZED LIGHTING
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Cap pixel density to reduce lag
    document.body.appendChild(renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(20, 40, 20);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x707070));

    // 3. MATERIALS & GEOMETRY
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const grassMat = new THREE.MeshLambertMaterial({ color: 0x7ec850 }); // Light Green
    const dirtMat  = new THREE.MeshLambertMaterial({ color: 0x9b7653 }); // Light Brown

    // 4. TERRAIN GENERATION (INSTANCED MESH FOR ZERO LAG)
    const SEED = Math.random() * 100;
    function getTerrainHeight(x, z) {
      const scale1 = 0.08;
      const scale2 = 0.03;
      let h = Math.sin((x + SEED) * scale1) * Math.cos((z + SEED) * scale1) * 3;
      h += Math.sin((x - SEED) * scale2) * 4;
      return Math.floor(h);
    }

    const CHUNK_SIZE = 16;
    const RENDER_DISTANCE = 1; // Small render distance prevents stutter
    const loadedChunks = {};
    const worldBlocks = {};

    const dummy = new THREE.Object3D();

    function generateChunk(chunkX, chunkZ) {
      const chunkKey = `${chunkX},${chunkZ}`;
      if (loadedChunks[chunkKey]) return;

      const startX = chunkX * CHUNK_SIZE;
      const startZ = chunkZ * CHUNK_SIZE;
      const totalBlocksPerChunk = CHUNK_SIZE * CHUNK_SIZE;

      // 1 InstancedMesh for Grass, 1 InstancedMesh for Dirt per chunk
      const grassMesh = new THREE.InstancedMesh(boxGeo, grassMat, totalBlocksPerChunk);
      const dirtMesh = new THREE.InstancedMesh(boxGeo, dirtMat, totalBlocksPerChunk * 2);

      let grassIndex = 0;
      let dirtIndex = 0;

      for (let x = startX; x < startX + CHUNK_SIZE; x++) {
        for (let z = startZ; z < startZ + CHUNK_SIZE; z++) {
          const height = getTerrainHeight(x, z);
          worldBlocks[`${x},${z}`] = height;

          // Top Grass Block
          dummy.position.set(x, height, z);
          dummy.updateMatrix();
          grassMesh.setMatrixAt(grassIndex++, dummy.matrix);

          // 2 Dirt Blocks Below
          for (let y = height - 1; y >= height - 2; y--) {
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            dirtMesh.setMatrixAt(dirtIndex++, dummy.matrix);
          }
        }
      }

      grassMesh.instanceMatrix.needsUpdate = true;
      dirtMesh.instanceMatrix.needsUpdate = true;

      const chunkGroup = new THREE.Group();
      chunkGroup.add(grassMesh);
      chunkGroup.add(dirtMesh);

      scene.add(chunkGroup);
      loadedChunks[chunkKey] = chunkGroup;
    }

    function updateChunks() {
      const playerChunkX = Math.floor(camera.position.x / CHUNK_SIZE);
      const playerChunkZ = Math.floor(camera.position.z / CHUNK_SIZE);

      for (let x = playerChunkX - RENDER_DISTANCE; x <= playerChunkX + RENDER_DISTANCE; x++) {
        for (let z = playerChunkZ - RENDER_DISTANCE; z <= playerChunkZ + RENDER_DISTANCE; z++) {
          generateChunk(x, z);
        }
      }
    }

    // 5. PHYSICS & RIGID MOVEMENT (NO AUTO-JUMP & BALANCED JUMP)
    const controls = new THREE.PointerLockControls(camera, document.body);
    document.body.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
    controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'block');

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocityY = 0;
    let canJump = false;
    const GRAVITY = -0.009;   // Smoother gravity
    const JUMP_FORCE = 0.14;  // Normal jump height (about 1.2 blocks high)
    const PLAYER_HEIGHT = 1.8;

    camera.position.set(0, getTerrainHeight(0, 0) + 5, 0);

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;
      if (e.code === 'Space' && canJump) {
        velocityY = JUMP_FORCE;
        canJump = false;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    // 6. MULTIPLAYER SYNC (THROTTLED TO PREVENT NETWORK LAG)
    const playerId = 'player_' + Math.floor(Math.random() * 10000);
    const otherPlayers = {};
    let lastNetworkUpdate = 0;

    function updateMultiplayer() {
      const now = Date.now();
      // Only send network data 20 times per second
      if (now - lastNetworkUpdate > 50) {
        db.ref('players/' + playerId).set({
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z
        });
        lastNetworkUpdate = now;
      }
    }

    db.ref('players').on('value', (snapshot) => {
      const data = snapshot.val();
      for (let id in data) {
        if (id !== playerId) {
          if (!otherPlayers[id]) {
            const avatar = new THREE.Mesh(
              new THREE.BoxGeometry(0.8, 1.8, 0.8),
              new THREE.MeshLambertMaterial({ color: 0xe74c3c })
            );
            scene.add(avatar);
            otherPlayers[id] = avatar;
          }
          otherPlayers[id].position.set(data[id].x, data[id].y, data[id].z);
        }
      }
    });

    db.ref('players/' + playerId).onDisconnect().remove();

    // 7. GAME LOOP
    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        // Horizontal Movement
        if (moveForward) controls.moveForward(0.1);
        if (moveBackward) controls.moveForward(-0.1);
        if (moveLeft) controls.moveRight(-0.1);
        if (moveRight) controls.moveRight(0.1);

        // Apply Gravity & Manual Jump
        velocityY += GRAVITY;
        camera.position.y += velocityY;

        // Ground Collision & Block Wall Check (NO AUTO-JUMP)
        const currentX = Math.round(camera.position.x);
        const currentZ = Math.round(camera.position.z);
        const groundHeight = worldBlocks[`${currentX},${currentZ}`] ?? 0;
        const groundY = groundHeight + PLAYER_HEIGHT;

        if (camera.position.y <= groundY) {
          camera.position.y = groundY;
          velocityY = 0;
          canJump = true;
        }

        updateChunks();
        updateMultiplayer();
      }

      renderer.render(scene, camera);
    }

    // Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
