<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KitaBlox - Advanced Voxel Sandbox</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5; display: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
    #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

    #menu-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.98));
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; color: white;
    }
    .menu-card {
      background: #1e293b; padding: 40px; border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); width: 400px; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .menu-card h1 { color: #4ade80; margin: 0 0 8px 0; font-size: 42px; font-weight: 900; letter-spacing: -1px; }
    .menu-card p { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    .btn-play {
      width: 100%; padding: 16px; background: #4ade80; border: none; border-radius: 10px;
      color: #0f172a; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(74, 222, 128, 0.4);
    }
    .btn-play:hover { background: #22c55e; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74, 222, 128, 0.6); }

    #hud-instructions {
      position: absolute; top: 20px; left: 20px;
      color: #f8fafc; background: rgba(15, 23, 42, 0.65); padding: 16px 20px; border-radius: 12px;
      font-size: 13px; z-index: 5; display: none; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1); line-height: 1.6;
    }

    #hotbar-container {
      position: absolute; bottom: 24px; left: 50%;
      transform: translateX(-50%); display: none; gap: 8px;
      background: rgba(15, 23, 42, 0.75); padding: 8px; border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15); z-index: 10; backdrop-filter: blur(10px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .hotbar-slot {
      width: 54px; height: 54px; background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.15); border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 6px; color: white; font-size: 11px; font-weight: 700; position: relative;
      transition: all 0.15s ease;
    }
    .hotbar-slot.active {
      border-color: #4ade80; background: rgba(74, 222, 128, 0.2);
      transform: scale(1.1); box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
    }
    .slot-num { position: absolute; top: 4px; left: 6px; font-size: 10px; color: #94a3b8; }

    #fps-counter {
      position: absolute; top: 20px; right: 20px; color: #4ade80;
      font-family: monospace; font-size: 13px; z-index: 5; display: none;
      background: rgba(15,23,42,0.65); padding: 6px 10px; border-radius: 8px;
    }
  </style>
</head>
<body>

  <div id="menu-overlay">
    <div class="menu-card">
      <h1>KitaBlox</h1>
      <p>High-Performance Web Voxel Sandbox</p>
      <button class="btn-play" id="start-game-btn">ENTER WORLD</button>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="fps-counter">FPS: --</div>

  <div id="hud-instructions">
    <b style="color: #4ade80; font-size: 14px;">Controls</b><br>
    WASD : Move | SPACE : Jump<br>
    Left Click : Break Block<br>
    Right Click : Place Block<br>
    1-7 / Scroll : Hotbar<br>
    ESC : Release mouse
  </div>

  <div id="hotbar-container">
    <div class="hotbar-slot active" data-slot="0"><span class="slot-num">1</span><span>Grass</span></div>
    <div class="hotbar-slot" data-slot="1"><span class="slot-num">2</span><span>Dirt</span></div>
    <div class="hotbar-slot" data-slot="2"><span class="slot-num">3</span><span>Stone</span></div>
    <div class="hotbar-slot" data-slot="3"><span class="slot-num">4</span><span>Wood</span></div>
    <div class="hotbar-slot" data-slot="4"><span class="slot-num">5</span><span>Leaves</span></div>
    <div class="hotbar-slot" data-slot="5"><span class="slot-num">6</span><span>Sand</span></div>
    <div class="hotbar-slot" data-slot="6"><span class="slot-num">7</span><span>Glass</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    // 1. PROCEDURAL PIXEL TEXTURE GENERATOR WITH DYNAMIC FACE SHADING
    function createTexture(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 16; canvas.height = 16;
      const ctx = canvas.getContext('2d');

      for (let x = 0; x < 16; x++) {
        for (let y = 0; y < 16; y++) {
          let n = (Math.random() - 0.5) * 18;
          if (type === 'grass_top') ctx.fillStyle = `rgb(${80 + n}, ${185 + n}, ${50 + n})`;
          else if (type === 'dirt') ctx.fillStyle = `rgb(${120 + n}, ${80 + n}, ${45 + n})`;
          else if (type === 'grass_side') ctx.fillStyle = y < 4 ? `rgb(${80 + n}, ${185 + n}, ${50 + n})` : `rgb(${120 + n}, ${80 + n}, ${45 + n})`;
          else if (type === 'stone') ctx.fillStyle = `rgb(${110 + n}, ${115 + n}, ${120 + n})`;
          else if (type === 'wood_top') ctx.fillStyle = `rgb(${140 + n}, ${100 + n}, ${55 + n})`;
          else if (type === 'wood_side') ctx.fillStyle = `rgb(${90 + n}, ${60 + n}, ${30 + n})`;
          else if (type === 'leaves') ctx.fillStyle = `rgb(${40 + n}, ${140 + n}, ${40 + n})`;
          else if (type === 'sand') ctx.fillStyle = `rgb(${215 + n}, ${195 + n}, ${125 + n})`;
          else if (type === 'glass') {
            ctx.fillStyle = (x === 0 || x === 15 || y === 0 || y === 15) ? 'rgba(255,255,255,0.7)' : 'rgba(200,230,255,0.15)';
          }
          ctx.fillRect(x, y, 1, 1);
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    const texMap = {
      grassTop: createTexture('grass_top'),
      grassSide: createTexture('grass_side'),
      dirt: createTexture('dirt'),
      stone: createTexture('stone'),
      woodTop: createTexture('wood_top'),
      woodSide: createTexture('wood_side'),
      leaves: createTexture('leaves'),
      sand: createTexture('sand'),
      glass: createTexture('glass')
    };

    function mat(tex, transparent = false, opacity = 1.0) {
      return new THREE.MeshLambertMaterial({ map: tex, transparent, opacity });
    }

    const blockMaterials = {
      1: [mat(texMap.grassSide), mat(texMap.grassSide), mat(texMap.grassTop), mat(texMap.dirt), mat(texMap.grassSide), mat(texMap.grassSide)],
      2: mat(texMap.dirt),
      3: mat(texMap.stone),
      4: [mat(texMap.woodSide), mat(texMap.woodSide), mat(texMap.woodTop), mat(texMap.woodTop), mat(texMap.woodSide), mat(texMap.woodSide)],
      5: mat(texMap.leaves, true, 0.9),
      6: mat(texMap.sand),
      7: mat(texMap.glass, true, 0.4)
    };

    // 2. WORLD DATA & CHUNK MANAGEMENT
    const worldBlocks = {};
    const blockMeshes = {};
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    let meshList = []; // cached array for raycasting, rebuilt only when world changes

    function getBlockKey(x, y, z) { return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`; }

    function rebuildMeshList() {
      meshList = Object.values(blockMeshes);
    }

    function setBlock(x, y, z, type) {
      const key = getBlockKey(x, y, z);
      if (type === 0) {
        if (blockMeshes[key]) {
          scene.remove(blockMeshes[key]);
          delete blockMeshes[key];
          delete worldBlocks[key];
        }
      } else {
        if (blockMeshes[key]) scene.remove(blockMeshes[key]);
        const mesh = new THREE.Mesh(boxGeo, blockMaterials[type]);
        mesh.position.set(x, y, z);
        mesh.userData = { x, y, z, type };
        scene.add(mesh);
        blockMeshes[key] = mesh;
        worldBlocks[key] = type;
      }
      rebuildMeshList();
    }

    function createTree(trX, trY, trZ) {
      for (let y = 0; y < 4; y++) setBlock(trX, trY + y, trZ, 4);
      for (let lx = -2; lx <= 2; lx++) {
        for (let lz = -2; lz <= 2; lz++) {
          for (let ly = 2; ly <= 4; ly++) {
            if (Math.abs(lx) === 2 && Math.abs(lz) === 2 && Math.random() > 0.4) continue;
            if (!worldBlocks[getBlockKey(trX + lx, trY + ly, trZ + lz)]) {
              setBlock(trX + lx, trY + ly, trZ + lz, 5);
            }
          }
        }
      }
    }

    // 3. ENGINE & SCENE SETUP
    let scene, camera, renderer, controls, raycaster, highlightBox;
    let particles = [];
    let activeBlockType = 1;
    let lastFrameTime = performance.now();
    let fpsAccum = 0, fpsFrames = 0;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x7ec0ee);
      scene.fog = new THREE.FogExp2(0x7ec0ee, 0.02);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      document.body.appendChild(renderer.domElement);

      // Sun & Hemisphere Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.7);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight.position.set(40, 60, 20);
      scene.add(dirLight);

      controls = new THREE.PointerLockControls(camera, document.body);
      raycaster = new THREE.Raycaster();
      raycaster.far = 7;

      // Selection Wireframe Highlight
      const wireGeo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
      const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
      highlightBox = new THREE.LineSegments(new THREE.WireframeGeometry(wireGeo), wireMat);
      highlightBox.visible = false;
      scene.add(highlightBox);

      // Generate World
      for (let x = -12; x <= 12; x++) {
        for (let z = -12; z <= 12; z++) {
          let h = Math.floor(Math.sin(x * 0.15) * Math.cos(z * 0.15) * 3);
          setBlock(x, h, z, 1);
          setBlock(x, h - 1, z, 2);
          setBlock(x, h - 2, z, 2);
          for (let y = h - 3; y >= h - 6; y--) setBlock(x, y, z, 3);

          if (x % 5 === 0 && z % 5 === 0 && Math.random() > 0.5 && Math.abs(x) > 2 && Math.abs(z) > 2) {
            createTree(x, h + 1, z);
          }
        }
      }

      camera.position.set(0, 6, 0);
      setupEvents();
      animate();
    }

    // 4. PARTICLE EFFECTS
    function spawnBreakParticles(x, y, z, type) {
      const pGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const pMat = Array.isArray(blockMaterials[type]) ? blockMaterials[type][0] : blockMaterials[type];

      for (let i = 0; i < 12; i++) {
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.set(
          x + (Math.random() - 0.5) * 0.8,
          y + (Math.random() - 0.5) * 0.8,
          z + (Math.random() - 0.5) * 0.8
        );
        p.userData = {
          vx: (Math.random() - 0.5) * 0.12,
          vy: Math.random() * 0.15 + 0.05,
          vz: (Math.random() - 0.5) * 0.12,
          life: 1.0
        };
        scene.add(p);
        particles.push(p);
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.vy -= 0.008; // particle gravity
        p.userData.life -= 0.03;
        p.scale.multiplyScalar(0.95);

        if (p.userData.life <= 0) {
          scene.remove(p);
          particles.splice(i, 1);
        }
      }
    }

    // 5. INPUTS & HOTBAR
    let moveF = false, moveB = false, moveL = false, moveR = false, jumpHeld = false;
    let velocity = new THREE.Vector3();
    let yVel = 0, isGrounded = false;
    let walkTimer = 0;

    function setupEvents() {
      document.getElementById('start-game-btn').addEventListener('click', () => {
        document.getElementById('menu-overlay').style.display = 'none';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('hud-instructions').style.display = 'block';
        document.getElementById('hotbar-container').style.display = 'flex';
        document.getElementById('fps-counter').style.display = 'block';
        controls.lock();
      });

      controls.addEventListener('unlock', () => {
        document.getElementById('menu-overlay').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'none';
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW') moveF = true;
        if (e.code === 'KeyS') moveB = true;
        if (e.code === 'KeyA') moveL = true;
        if (e.code === 'KeyD') moveR = true;
        if (e.code === 'Space') { jumpHeld = true; e.preventDefault(); }
        if (e.key >= '1' && e.key <= '7') selectSlot(parseInt(e.key) - 1);
      });

      document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveF = false;
        if (e.code === 'KeyS') moveB = false;
        if (e.code === 'KeyA') moveL = false;
        if (e.code === 'KeyD') moveR = false;
        if (e.code === 'Space') jumpHeld = false;
      });

      document.addEventListener('wheel', (e) => {
        if (!controls.isLocked) return;
        if (e.deltaY > 0) selectSlot((activeBlockType) % 7);
        else selectSlot((activeBlockType - 2 + 7) % 7);
      });

      document.addEventListener('mousedown', (e) => {
        if (!controls.isLocked) return;
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(meshList);

        if (hits.length > 0) {
          const hit = hits[0];
          const pos = hit.object.position;

          if (e.button === 0) { // Left Click: Break
            const bType = worldBlocks[getBlockKey(pos.x, pos.y, pos.z)];
            spawnBreakParticles(pos.x, pos.y, pos.z, bType);
            setBlock(pos.x, pos.y, pos.z, 0);
          } else if (e.button === 2) { // Right Click: Place
            const norm = hit.face.normal;
            const px = pos.x + norm.x;
            const py = pos.y + norm.y;
            const pz = pos.z + norm.z;

            // AABB Check against player position
            const playerBox = new THREE.Box3().setFromCenterAndSize(
              new THREE.Vector3(camera.position.x, camera.position.y - 0.7, camera.position.z),
              new THREE.Vector3(0.6, 1.8, 0.6)
            );
            const blockBox = new THREE.Box3().setFromCenterAndSize(
              new THREE.Vector3(px, py, pz),
              new THREE.Vector3(1, 1, 1)
            );

            if (!playerBox.intersectsBox(blockBox)) {
              setBlock(px, py, pz, activeBlockType);
            }
          }
        }
      });

      window.addEventListener('contextmenu', e => e.preventDefault());
    }

    function selectSlot(idx) {
      activeBlockType = idx + 1;
      const slots = document.querySelectorAll('.hotbar-slot');
      slots.forEach((s, i) => s.classList.toggle('active', i === idx));
    }

    // 6. PHYSICS & GAME LOOP
    function checkCollision(pos) {
      const pBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(pos.x, pos.y - 0.7, pos.z),
        new THREE.Vector3(0.5, 1.7, 0.5)
      );

      const minX = Math.floor(pos.x - 1), maxX = Math.ceil(pos.x + 1);
      const minY = Math.floor(pos.y - 2), maxY = Math.ceil(pos.y + 1);
      const minZ = Math.floor(pos.z - 1), maxZ = Math.ceil(pos.z + 1);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (worldBlocks[getBlockKey(x, y, z)]) {
              const bBox = new THREE.Box3().setFromCenterAndSize(new THREE.Vector3(x, y, z), new THREE.Vector3(1, 1, 1));
              if (pBox.intersectsBox(bBox)) return true;
            }
          }
        }
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);

      // FPS counter
      const now = performance.now();
      const dt = now - lastFrameTime;
      lastFrameTime = now;
      fpsAccum += dt; fpsFrames++;
      if (fpsAccum >= 500) {
        const fps = Math.round((fpsFrames * 1000) / fpsAccum);
        document.getElementById('fps-counter').textContent = 'FPS: ' + fps;
        fpsAccum = 0; fpsFrames = 0;
      }

      if (controls.isLocked) {
        // Smooth Friction & Momentum
        velocity.x *= 0.8;
        velocity.z *= 0.8;

        const dir = new THREE.Vector3();
        if (moveF) dir.z -= 1;
        if (moveB) dir.z += 1;
        if (moveL) dir.x -= 1;
        if (moveR) dir.x += 1;
        dir.normalize();

        if (moveF || moveB || moveL || moveR) {
          const moveDir = dir.applyQuaternion(camera.quaternion);
          moveDir.y = 0;
          moveDir.normalize();
          velocity.x += moveDir.x * 0.04;
          velocity.z += moveDir.z * 0.04;

          walkTimer += 0.15;
        }

        // Apply X Move & Collide
        camera.position.x += velocity.x;
        if (checkCollision(camera.position)) camera.position.x -= velocity.x;

        // Apply Z Move & Collide
        camera.position.z += velocity.z;
        if (checkCollision(camera.position)) camera.position.z -= velocity.z;

        // Gravity & Y Physics
        yVel -= 0.012;
        camera.position.y += yVel;

        if (checkCollision(camera.position)) {
          camera.position.y -= yVel;
          if (yVel < 0) { isGrounded = true; }
          yVel = 0;
        } else {
          isGrounded = false;
        }

        if (jumpHeld && isGrounded) {
          yVel = 0.22;
          isGrounded = false;
        }

        // Camera Walk Bobbing
        if (isGrounded && (moveF || moveB || moveL || moveR)) {
          camera.position.y += Math.sin(walkTimer) * 0.02;
        }

        // Raycast Outline Target
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const hits = raycaster.intersectObjects(meshList);
        if (hits.length > 0) {
          highlightBox.position.copy(hits[0].object.position);
          highlightBox.visible = true;
        } else {
          highlightBox.visible = false;
        }

        updateParticles();
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
